{% if user.is_authenticated %}
    <span class="nav-user-wrap">
        <span class="nav-user">{{ nav_display_name|default:user.username }}</span>
        {% if nav_is_backoffice_admin %}
            {% include 'core/components/backoffice_admin_badge_icon.html' %}
        {% endif %}
    </span>
    <form method="post" action="{% url 'logout' %}" class="inline-form">
        {% csrf_token %}
        <button class="button is-small is-light" type="submit">로그아웃</button>
    </form>
{% else %}
    <a class="button is-small is-light" href="{% url 'login' %}">로그인</a>
{% endif %}
