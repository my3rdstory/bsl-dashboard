{% extends 'base.html' %}
{% load static %}

{% block title %}회원 탈퇴{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/member-status.css' %}">
<link rel="stylesheet" href="{% static 'css/member-withdraw.css' %}">
{% endblock %}

{% block content %}
<div class="member-withdraw-page">
    <section class="box compact-box member-withdraw-header mb-4">
        <h2 class="title is-5 mb-2">회원 탈퇴</h2>
        <p class="is-size-7 has-text-grey mb-0">
            라이트닝 재인증으로 본인 확인 후 탈퇴를 진행합니다. 본인 계정 라이트닝 ID는
            <span class="mono-cell">{{ member.lightning_identifier }}</span> 입니다.
        </p>
    </section>

    <section class="member-withdraw-auth-panel" id="member-withdraw-auth-panel">
        <div
            class="is-hidden"
            hx-post="{% url 'core:my-withdraw-auth-start' %}"
            hx-trigger="load"
            hx-target="#member-withdraw-auth-panel"
            hx-swap="innerHTML"
        ></div>
    </section>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'js/lightning-auth.js' %}" defer></script>
{% endblock %}
